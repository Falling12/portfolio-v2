name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export NODE_ENV=production
            cd /root/portfolio-v2
            git pull origin main
            pnpm install --frozen-lockfile
            yes | pnpm payload migrate
            pnpm build
            pm2 restart portfolio-v2 --update-env
            pm2 save
